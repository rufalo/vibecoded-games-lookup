<!doctype html>

  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply a saved theme before first paint (no flash).
    try { var t = localStorage.getItem('vgl-theme'); if (t === '"light"' || t === '"dark"') document.documentElement.dataset.theme = JSON.parse(t); } catch (e) {}

      </a>
      <nav class="nav" aria-label="Main">
        <a href="#/" data-nav="catalog"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="7" width="20" height="10" rx="5"/><path d="M7 10v4M5 12h4M15 11h.01M18 13h.01"/></svg><span class="label">Games</span></a>
